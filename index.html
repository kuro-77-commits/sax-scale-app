<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAX PRACTICE TOOL</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --gold: #c9a84c;
    --gold-dim: #7a6030;
    --amber: #ff9500;
    --red: #ff3b30;
    --green: #30d158;
    --text: #f0ece0;
    --muted: #444;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow-x: hidden;
    position: relative;
    padding: env(safe-area-inset-top, 16px) 0 env(safe-area-inset-bottom, 16px);
  }

  /* HEADER */
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 0;
    z-index: 10;
  }
  .app-title {
    font-family: var(--font-display);
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    color: var(--gold);
  }
  .app-title small { display: block; font-size: 0.55rem; color: var(--gold-dim); }

  /* MODE TABS */
  .mode-tabs {
    display: flex;
    width: calc(100% - 48px);
    max-width: 520px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-top: 10px;
  }
  .tab {
    flex: 1;
    font-family: var(--font-display);
    font-size: 1rem;
    padding: 10px 0;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
  }
  .tab.active { color: var(--gold); background: rgba(201,168,76,0.06); }

  /* SHEET MUSIC AREA */
  #sheetMusic {
    width: calc(100% - 48px);
    max-width: 520px;
    background: #fff; /* 楽譜は見やすさ重視で白背景 */
    border-radius: 8px;
    margin: 15px 0;
    padding: 10px;
    min-height: 120px;
  }

  /* TUNER & SCALE DISPLAYS */
  #tunerMode, #scaleMode {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    width: 100%;
    padding: 0 24px;
  }

  .note-display {
    font-family: var(--font-display);
    font-size: clamp(100px, 25vw, 180px);
    line-height: 1;
    color: var(--text);
  }

  .scale-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 15px;
  }
  .scale-btn {
    font-size: 10px;
    padding: 6px 10px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
  }
  .scale-btn.selected { color: var(--gold); border-color: var(--gold-dim); }

  /* BOTTOM BAR */
  .bottom-bar { width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .start-btn {
    font-family: var(--font-display);
    font-size: 1.4rem;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 12px 60px;
    border-radius: 4px;
    cursor: pointer;
  }
  .start-btn.running { background: var(--gold); color: var(--bg); }

</style>
</head>
<body>

<header>
  <div class="app-title">
    SAX PRACTICE APP
    <small>ALTO E♭ MODE</small>
  </div>
</header>

<div class="mode-tabs">
  <button class="tab active" id="tabTuner" onclick="switchMode('tuner')">TUNER</button>
  <button class="tab" id="tabScale" onclick="switchMode('scale')">SCALE</button>
</div>

<div id="sheetMusic"></div>

<div id="tunerMode">
  <div class="note-display" id="tunerNote">—</div>
  <div id="freqReadout" style="color:var(--gold-dim)">0.0 Hz</div>
</div>

<div id="scaleMode" style="display:none">
  <div class="scale-selector" id="scaleSelector"></div>
  <div class="note-display" id="targetNote">—</div>
  <div style="color:var(--gold-dim); letter-spacing: 0.2em;">NEXT NOTE</div>
</div>

<div class="bottom-bar">
  <button class="start-btn" id="startBtn" onclick="toggleMain()">START</button>
  <div style="margin-top:10px; font-size:10px; color:var(--muted)">1.0s Rhythm Guide Active</div>
</div>

<script>
// ─── DATA & STATE ───────────────────────────────────────────
const SCALES = {
  'C Major':  ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'],
  'G Major':  ['G', 'A', 'B', 'C', 'D', 'E', 'F#', 'G'],
  'F Major':  ['F', 'G', 'A', 'Bb', 'C', 'D', 'E', 'F'],
  'D Minor':  ['D', 'E', 'F', 'G', 'A', 'Bb', 'C', 'D']
};

let currentMode = 'tuner';
let selectedScale = 'C Major';
let running = false;
let rhythmInterval = null;
let audioCtx, analyser, micStream;

// ─── INITIALIZE ─────────────────────────────────────────────
function initScaleButtons() {
  const container = document.getElementById('scaleSelector');
  Object.keys(SCALES).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'scale-btn' + (name === selectedScale ? ' selected' : '');
    btn.textContent = name;
    btn.onclick = () => {
      selectedScale = name;
      document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateSheet();
    };
    container.appendChild(btn);
  });
}
initScaleButtons();
updateSheet();

// ─── UI FUNCTIONS ───────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tunerMode').style.display = mode === 'tuner' ? 'flex' : 'none';
  document.getElementById('scaleMode').style.display = mode === 'scale' ? 'flex' : 'none';
  document.getElementById('tabTuner').classList.toggle('active', mode === 'tuner');
  document.getElementById('tabScale').classList.toggle('active', mode === 'scale');
  updateSheet();
}

function updateSheet() {
  let abcString = "";
  if (currentMode === 'tuner') {
    abcString = "X:1\nK:C\nL:1/4\n[CEG]"; // チューナー時は基本の和音表示
  } else {
    const notes = SCALES[selectedScale].map(n => n.replace('#', '^').replace('b', '_')).join(' ');
    abcString = `X:1\nK:C\nL:1/4\n${notes}`;
  }
  ABCJS.renderAbc("sheetMusic", abcString, { responsive: 'resize', scale: 1.3 });
}

// ─── CONTROL FUNCTIONS ──────────────────────────────────────
async function toggleMain() {
  if (running) {
    stopAll();
  } else {
    await startAll();
  }
}

async function startAll() {
  running = true;
  document.getElementById('startBtn').textContent = 'STOP';
  document.getElementById('startBtn').classList.add('running');

  if (currentMode === 'scale') {
    startRhythmGuide();
  } else {
    startTuner();
  }
}

function stopAll() {
  running = false;
  document.getElementById('startBtn').textContent = 'START';
  document.getElementById('startBtn').classList.remove('running');
  if (rhythmInterval) clearInterval(rhythmInterval);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  document.getElementById('targetNote').textContent = "—";
}

function startRhythmGuide() {
  let step = 0;
  const notes = SCALES[selectedScale];
  rhythmInterval = setInterval(() => {
    if (!running) return;
    document.getElementById('targetNote').textContent = notes[step % notes.length];
    step++;
  }, 1000); // 1秒間隔のリズムガイド
}

// チューナーの基本ロジック（簡易版）
async function startTuner() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // ※本来はここで周波数解析を行いますが、今回はリズムと表示を優先
    document.getElementById('tunerNote').textContent = "READY";
  } catch (e) {
    alert("マイク許可が必要です");
  }
}

</script>
</body>
</html>
