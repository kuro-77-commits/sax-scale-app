<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SAX SCALE MASTER</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic-min.js"></script>

<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --border: #333;
    --gold: #c9a84c;
    --text: #f0ece0;
    --muted: #666;
    --font-display: 'Bebas Neue', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0 30px;
  }

  .app-header {
    width: 100%;
    max-width: 600px;
    padding: 0 12px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .app-title {
    font-family: var(--font-display);
    font-size: 1.3rem;
    color: var(--gold);
    letter-spacing: 0.2em;
  }

  .app-sub { font-size: 10px; color: var(--muted); }

  .main {
    width: 100%;
    max-width: 600px;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #sheetMusic {
    width: 100%;
    background: #fff;
    border-radius: 10px;
    padding: 12px 4px;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #sheetMusic svg {
    width: 100% !important;
    height: auto !important;
  }

  .note-highlight {
    position: absolute;
    border: 3px solid #e03030;
    border-radius: 50%;
    pointer-events: none;
    box-sizing: border-box;
  }

  .section-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.1em;
  }

  .section { width: 100%; }

  .scale-selector { display: flex; flex-wrap: wrap; gap: 6px; }

  .scale-btn {
    padding: 7px 10px;
    background: var(--surface);
    color: #888;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    transition: 0.15s;
  }

  .scale-btn.selected {
    background: #252525;
    color: var(--gold);
    border-color: var(--gold);
  }

  .dir-buttons { display: flex; gap: 6px; }

  .dir-btn {
    flex: 1;
    padding: 9px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 0.9rem;
    cursor: pointer;
    transition: 0.15s;
  }

  .dir-btn.selected {
    background: #252525;
    color: var(--gold);
    border-color: var(--gold);
  }

  .tempo-row { display: flex; align-items: center; gap: 10px; }
  .tempo-row input[type=range] { flex: 1; accent-color: var(--gold); }

  .note-area {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 4px 0;
  }

  .target-note {
    font-family: var(--font-display);
    font-size: 72px;
    color: var(--gold);
    min-width: 160px;
    text-align: center;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  .step-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: #555;
    text-align: right;
  }

  .start-btn {
    font-family: var(--font-display);
    font-size: 1.8rem;
    padding: 14px 80px;
    background: transparent;
    color: var(--gold);
    border: 2px solid var(--gold);
    border-radius: 50px;
    cursor: pointer;
    transition: 0.2s;
    letter-spacing: 0.1em;
  }

  .start-btn.running {
    background: var(--gold);
    color: #000;
  }
</style>
</head>
<body>

<div class="app-header">
  <span class="app-title">SAX SCALE MASTER</span>
  <span class="app-sub">ALTO Eb · 2-OCT</span>
</div>

<div class="main">

  <div id="sheetMusic"></div>

  <div class="section">
    <div class="section-label">SCALE</div>
    <div class="scale-selector" id="scaleSelector"></div>
  </div>

  <div class="section">
    <div class="section-label">DIRECTION</div>
    <div class="dir-buttons">
      <button id="btn-up"     class="dir-btn selected" onclick="setDir('up')">▲ UP</button>
      <button id="btn-updown" class="dir-btn"          onclick="setDir('updown')">▲▼ UP+DOWN</button>
      <button id="btn-down"   class="dir-btn"          onclick="setDir('down')">▼ DOWN</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">TEMPO — <span id="bpmLabel">60</span> BPM</div>
    <div class="tempo-row">
      <span style="font-size:11px;color:var(--muted);">40</span>
      <input type="range" id="tempoSlider" min="40" max="160" value="60" step="1" oninput="updateTempo()">
      <span style="font-size:11px;color:var(--muted);">160</span>
    </div>
  </div>

  <div class="note-area">
    <div class="target-note" id="targetNote">—</div>
    <div class="step-info">
      <span id="stepInfo">—</span>
      <span id="dirInfo"></span>
    </div>
  </div>

  <button class="start-btn" id="startBtn" onclick="toggleStart()">START</button>

</div>

<script>
const SCALES = {
  'C Maj':  ['C','D','E','F','G','A','B','c','d','e','f','g','a','b','c\''],
  'G Maj':  ['G,','A,','B,','C','D','E','^F','G','A','B','c','d','e','^f','g'],
  'D Maj':  ['D','E','^F','G','A','B','^c','d','e','^f','g','a','b','^c\'','d\''],
  'A Maj':  ['A,','B,','^C','D','E','^F','^G','A','B','^c','d','e','^f','^g','a'],
  'F Maj':  ['F,','G,','A,','_B,','C','D','E','F','G','A','_B','c','d','e','f'],
  'Bb Maj': ['_B,','C','D','_E','F','G','A','_B','c','d','_e','f','g','a','_b'],
  'Eb Maj': ['_E','F','G','_A','_B','c','d','_e','f','g','_a','_b','c\'','d\'','_e\''],
  'A Min':  ['A,','B,','C','D','E','F','G','A','B','c','d','e','f','g','a'],
  'D Min':  ['D','E','F','G','A','_B','C','d','e','f','g','a','_b','c\'','d\''],
  'E Min':  ['E','^F','G','A','B','c','^d','e','^f','g','a','b','c\'','^d\'','e\''],
  'C Pent': ['C','D','E','G','A','c','d','e','g','a','c\''],
  'G Pent': ['G,','A,','B,','D','E','G','A','B','d','e','g'],
};

const KEY_MAP = {
  'C Maj':'C', 'G Maj':'G', 'D Maj':'D', 'A Maj':'A',
  'F Maj':'F', 'Bb Maj':'Bb', 'Eb Maj':'Eb',
  'A Min':'Am', 'D Min':'Dm', 'E Min':'Em',
  'C Pent':'C', 'G Pent':'G'
};

const KANA_MAP = {
  'C':'ド',  'D':'レ',  'E':'ミ',  'F':'ファ', 'G':'ソ',  'A':'ラ',  'B':'シ',
  '^C':'ド#', '^D':'レ#', '^F':'ファ#', '^G':'ソ#', '^A':'ラ#',
  '_D':'レ♭', '_E':'ミ♭', '_G':'ソ♭', '_A':'ラ♭', '_B':'シ♭'
};

function noteLabel(n) {
  const clean = n.replace(/[,\'0-9]/g, '').toUpperCase();
  const hasAccidental = /^[\^_]/.test(clean);
  const key = hasAccidental ? clean.slice(0, 2) : clean.slice(0, 1);
  const kana = KANA_MAP[key] || key;
  const accidental = hasAccidental ? (clean[0] === '^' ? '#' : '♭') : '';
  const alpha = clean.replace(/[\^_]/g, '') + accidental;
  return `${kana}(${alpha})`;
}

let selectedScale = 'C Maj';
let direction = 'up';
let running = false;
let step = 0;
let timer = null;
let bpm = 60;

function getNotes() {
  const base = SCALES[selectedScale];
  if (direction === 'up')   return base;
  if (direction === 'down') return [...base].reverse();
  return [...base, ...[...base].reverse().slice(1)];
}

function buildABC() {
  const base = SCALES[selectedScale];
  const notes = base.join(' ');
  const key = KEY_MAP[selectedScale] || 'C';
  return `X:1\nM:C\nL:1/4\nK:${key}\n${notes} |]`;
}

function highlightNote() {
  document.querySelectorAll('.note-highlight').forEach(el => el.remove());
  const sheetEl = document.getElementById('sheetMusic');
  const svg = sheetEl.querySelector('svg');
  if (!svg) return;
  const noteEls = svg.querySelectorAll('.abcjs-note');
  if (!noteEls.length) return;

  const base = SCALES[selectedScale];
  const notes = getNotes();
  const curNote = notes[step % notes.length];

  let baseIdx = base.indexOf(curNote);
  if (baseIdx === -1) {
    const curClean = curNote.replace(/[,\'0-9]/g, '').toUpperCase();
    baseIdx = base.findIndex(n => n.replace(/[,\'0-9]/g, '').toUpperCase() === curClean);
  }
  if (baseIdx < 0 || baseIdx >= noteEls.length) return;

  const noteHead = noteEls[baseIdx].querySelector('.abcjs-notehead') || noteEls[baseIdx];
  const headRect = noteHead.getBoundingClientRect();
  const sheetRect = sheetEl.getBoundingClientRect();
  const size = Math.max(headRect.width, headRect.height) * 2.4 + 12;

  const circle = document.createElement('div');
  circle.className = 'note-highlight';
  circle.style.width  = size + 'px';
  circle.style.height = size + 'px';
  circle.style.left   = (headRect.left - sheetRect.left + headRect.width  / 2 - size / 2) + 'px';
  circle.style.top    = (headRect.top  - sheetRect.top  + headRect.height / 2 - size / 2) + 'px';
  sheetEl.appendChild(circle);
}

function updateDisplay() {
  const notes = getNotes();
  const idx = step % notes.length;
  const cur = notes[idx];
  document.getElementById('targetNote').textContent = noteLabel(cur);
  document.getElementById('stepInfo').textContent = `${idx + 1} / ${notes.length}`;
  document.getElementById('dirInfo').textContent =
    direction === 'updown'
      ? (idx < SCALES[selectedScale].length ? '▲ 上行中' : '▼ 下行中') : '';

  ABCJS.renderAbc('sheetMusic', buildABC(), {
    responsive: 'resize',
    scale: 2.8,
    staffwidth: 340,
    paddingleft: 15,
    paddingright: 15,
  });
  setTimeout(() => highlightNote(), 60);
}

function updateTick() {
  const notes = getNotes();
  const idx = step % notes.length;
  const cur = notes[idx];
  document.getElementById('targetNote').textContent = noteLabel(cur);
  document.getElementById('stepInfo').textContent = `${idx + 1} / ${notes.length}`;
  document.getElementById('dirInfo').textContent =
    direction === 'updown'
      ? (idx < SCALES[selectedScale].length ? '▲ 上行中' : '▼ 下行中') : '';
  highlightNote();
}

function setDir(d) {
  direction = d;
  step = 0;
  document.querySelectorAll('.dir-btn').forEach(btn => btn.classList.remove('selected'));
  document.getElementById('btn-' + d).classList.add('selected');
  updateDisplay();
}

function updateTempo() {
  bpm = parseInt(document.getElementById('tempoSlider').value);
  document.getElementById('bpmLabel').textContent = bpm;
  if (running) {
    clearInterval(timer);
    timer = setInterval(tick, 60000 / bpm);
  }
}

function tick() {
  step++;
  updateTick();
}

function toggleStart() {
  running = !running;
  const btn = document.getElementById('startBtn');
  if (running) {
    btn.textContent = 'STOP';
    btn.classList.add('running');
    step = 0;
    updateDisplay();
    timer = setInterval(tick, 60000 / bpm);
  } else {
    btn.textContent = 'START';
    btn.classList.remove('running');
    clearInterval(timer);
    document.querySelectorAll('.note-highlight').forEach(el => el.remove());
  }
}

function init() {
  const container = document.getElementById('scaleSelector');
  Object.keys(SCALES).forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'scale-btn' + (name === selectedScale ? ' selected' : '');
    btn.textContent = name;
    btn.onclick = () => {
      selectedScale = name;
      step = 0;
      document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateDisplay();
    };
    container.appendChild(btn);
  });
  updateDisplay();
}

window.onload = init;
</script>
</body>
</html>
